<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manual Apply · Security Jobs</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg"></div>
  <header>
    <div class="brand">
      <h1>Manual Apply</h1>
      <p class="tagline">Security Jobs · Europe · UK · Remote</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="new" type="button">New</button>
      <button class="tab" data-tab="applied" type="button">Applied</button>
    </div>
  </header>

  <nav class="filters" aria-label="Filters">
    <button class="filter active" data-filter="all" type="button">All</button>
    <button class="filter" data-filter="netherlands" type="button">Netherlands</button>
    <button class="filter" data-filter="uk" type="button">UK</button>
    <button class="filter" data-filter="europe" type="button">Europe</button>
    <button class="filter" data-filter="remote" type="button">Remote</button>
    <button class="filter" data-filter="visa" type="button">Visa Mentioned</button>
  </nav>

  <main>
    <p class="meta" id="meta">Loading…</p>
    <div id="jobs" class="jobs"></div>
    <p class="empty hidden" id="empty">No jobs match this view.</p>
  </main>

  <footer>
    <p>No descriptions · APPLY opens the original posting · MARK APPLIED saves in this browser only</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
